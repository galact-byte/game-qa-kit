name: macOS arm64 ScreenCaptureKit probe

on:
  workflow_dispatch:
  push:
    branches: [experiment/macos-arm-capture]
    paths:
      - tools/probe_macos_capture.swift
      - .github/workflows/macos-arm-capture-probe.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Record native environment
        run: |
          mkdir -p probe-output
          uname -a > probe-output/environment.txt
          sw_vers >> probe-output/environment.txt
          xcrun swiftc --version >> probe-output/environment.txt
          test "$(uname -m)" = arm64
      - name: Compile native probe with installed SDK
        run: |
          xcrun swiftc -parse-as-library -swift-version 5 -O tools/probe_macos_capture.swift -o probe-output/capture-probe -framework AppKit -framework ScreenCaptureKit -framework CoreMedia -framework CoreVideo -framework CoreImage 2>&1 | tee probe-output/compile.log
      - name: Probe single-window stream without changing permissions
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          root = Path('probe-output').resolve()
          with (root / 'run.log').open('wb') as log:
              try:
                  result = subprocess.run([str(root/'capture-probe'), 'capture', str(root)], stdout=log, stderr=subprocess.STDOUT, timeout=100)
              except subprocess.TimeoutExpired:
                  (root/'timeout.txt').write_text('Native ScreenCaptureKit query or stream exceeded 100 seconds. No TCC changes performed.\n')
                  raise
          raise SystemExit(result.returncode)
          PY
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm-capture-probe
          path: probe-output/
          retention-days: 14
