name: macOS arm64 ScreenCaptureKit probe

on:
  workflow_dispatch:
    inputs:
      renderer:
        description: Target rendering path
        type: choice
        options: [metal, appkit]
        default: metal
  push:
    branches: [experiment/macos-arm-capture]
    paths:
      - tools/probe_macos_capture.swift
      - .github/workflows/macos-arm-capture-probe.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 8
    env:
      GAMEQA_PROBE_RENDERER: ${{ inputs.renderer || 'metal' }}
    steps:
      - uses: actions/checkout@v4
      - name: Record native environment
        run: |
          mkdir -p probe-output
          uname -a > probe-output/environment.txt
          sw_vers >> probe-output/environment.txt
          xcrun swiftc --version >> probe-output/environment.txt
          test "$(uname -m)" = arm64
      - name: Compile native probe with installed SDK
        run: |
          xcrun swiftc -parse-as-library -swift-version 5 -O tools/probe_macos_capture.swift -o probe-output/capture-probe -framework AppKit -framework ScreenCaptureKit -framework CoreMedia -framework CoreVideo -framework CoreImage -framework Metal -framework MetalKit 2>&1 | tee probe-output/compile.log
      - name: Probe single-window stream without changing permissions
        run: |
          python3 - <<'PY'
          import json
          import os
          import signal
          import subprocess
          from pathlib import Path
          root = Path('probe-output').resolve()
          code = 1
          cleanup = {}
          with (root / 'run.log').open('wb') as log:
              process = subprocess.Popen([str(root/'capture-probe'), 'capture', str(root)], stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
              try:
                  code = process.wait(timeout=100)
              except subprocess.TimeoutExpired:
                  (root/'timeout.txt').write_text('Native ScreenCaptureKit query or stream exceeded 100 seconds. No TCC changes performed.\n')
              finally:
                  try:
                      os.killpg(process.pid, signal.SIGTERM)
                      cleanup['remaining_group_terminated'] = True
                  except ProcessLookupError:
                      cleanup['remaining_group_terminated'] = False
                  try:
                      process.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait(timeout=5)
                      cleanup['forced_kill'] = True
                  cleanup['parent_exit_code'] = process.returncode
                  (root/'watchdog.json').write_text(json.dumps(cleanup, indent=2))
          raise SystemExit(code)
          PY
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm-capture-probe
          path: probe-output/
          retention-days: 14
