name: Universal desktop test builds

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release:
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: '测试包版本，不创建 Release 或标签'
        required: true
        default: v0.4.1-universal-test
        type: string

permissions:
  contents: read

concurrency:
  group: universal-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: ${{ !inputs.release }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.7'
          architecture: x64
          cache: pip
          cache-dependency-path: tools/requirements-windows.txt
      - name: Install existing pinned requirements
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: -r tools/requirements-windows.txt
      - name: Run portable Windows regression suite
        env:
          PYTHONPATH: ${{ github.workspace }}/tests
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          python -X utf8 -B -W error::ResourceWarning -m unittest tests.test_application tests.test_release_build tests.test_core tests.test_admission tests.test_admission_cli tests.test_admission_directories tests.test_game_session tests.test_game_worker tests.test_game_mcp tests.test_sessions tests.test_admission_gui tests.test_gui tests.test_route_report tests.test_route_mcp -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and self-test Windows portable application
        run: python -X utf8 -B tools/build_windows.py --version "${{ inputs.version }}" --output "${{ runner.temp }}/gameqa-build"
      - name: Upload Windows candidate without publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GameQA-windows-x64
          path: |
            ${{ runner.temp }}/gameqa-build/game-qa-kit-*-windows-x64.zip
            ${{ runner.temp }}/gameqa-build/SHA256SUMS.txt
            ${{ runner.temp }}/gameqa-build/self-test.json
            ${{ runner.temp }}/gameqa-build/worker-self-test.json
            ${{ runner.temp }}/gameqa-build/portable-gui.png
          if-no-files-found: error
  build:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: macos-15-intel
            platform: macos
            arch: x64
          - runner: macos-15
            platform: macos
            arch: arm64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
      BUILD_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.7'
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: tools/requirements-unix.txt
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
          libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
          libxcb-shape0 libxcb-xinerama0 xvfb fonts-noto-cjk
      - name: Install pinned build requirements
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          -r tools/requirements-unix.txt
      - name: Run public-entry regressions
        run: >-
          python -X utf8 -B -m unittest tests.test_platform_support
          tests.test_startup_check tests.test_application
          tests.test_route_report tests.test_route_mcp -v
      - name: Build and check native package
        run: python -X utf8 -B tools/build_unix.py --version "$BUILD_VERSION" --output "$RUNNER_TEMP/universal-build"
      - name: Check Linux window on X11
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a env QT_QPA_PLATFORM=xcb
          "$RUNNER_TEMP/universal-build/dist/GameQA/GameQA"
          --smoke-test "$RUNNER_TEMP/universal-build/desktop-check.json"
      - name: Check macOS Cocoa window
        if: runner.os == 'macOS'
        run: >-
          QT_QPA_PLATFORM=cocoa "$RUNNER_TEMP/universal-build/dist/GameQA.app/Contents/MacOS/GameQA"
          --smoke-test "$RUNNER_TEMP/universal-build/desktop-check.json"
      - name: Upload test package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.release && format('release-assets-{0}-{1}', matrix.platform, matrix.arch) || format('universal-{0}-{1}', matrix.platform, matrix.arch) }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/universal-build/game-qa-kit-*.tar.gz
            ${{ runner.temp }}/universal-build/SHA256SUMS.txt
      - name: Upload startup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: universal-${{ matrix.platform }}-${{ matrix.arch }}-checks
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ runner.temp }}/universal-build/self-test.json
            ${{ runner.temp }}/universal-build/self-test.png
            ${{ runner.temp }}/universal-build/desktop-check.json
            ${{ runner.temp }}/universal-build/desktop-check.png
