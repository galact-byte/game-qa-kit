name: macOS arm64 product capture validation

on:
  workflow_dispatch:
    inputs:
      frame_timing_only:
        description: Run only the independent frame timing diagnostic
        type: boolean
        default: false
  push:
    branches: [feature/macos-arm-capture-product]
    paths:
      - gameqakit/**
      - plugins/macos_capture/**
      - tools/**
      - tests/test_macos_*.py
      - tests/test_capture_session.py
      - tests/test_platform_support.py
      - tests/test_application.py
      - .github/workflows/macos-arm-product.yml

permissions:
  contents: read

jobs:
  product:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.frame_timing_only }}
    runs-on: macos-15
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
      GAMEQAKIT_NATIVE_DIAGNOSTICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.7'
          architecture: arm64
          cache: pip
          cache-dependency-path: tools/requirements-unix.txt
      - name: Install existing pinned requirements
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: -r tools/requirements-unix.txt
      - name: Compile native component and independent windows
        run: |
          mkdir -p product-output/native
          uname -a > product-output/environment.txt
          sw_vers >> product-output/environment.txt
          test "$(uname -m)" = arm64
          xcrun swiftc -parse-as-library -swift-version 5 -O -target arm64-apple-macosx14.0 -import-objc-header plugins/macos_capture/ProcessIdentity.h plugins/macos_capture/CaptureHelper.swift -o plugins/macos_capture/GameQACapture -framework AppKit -framework ScreenCaptureKit
          xcrun swiftc -parse-as-library -swift-version 5 -O tools/probe_macos_capture.swift -o product-output/native/fixture -framework AppKit -framework ScreenCaptureKit -framework CoreMedia -framework CoreVideo -framework CoreImage -framework Metal -framework MetalKit
      - name: Check contracts and entry lifecycle
        run: >-
          python -X utf8 -B -m unittest tests.test_macos_capture tests.test_macos_entry
          tests.test_capture_session tests.test_platform_support tests.test_application
          tests.test_release_assembly tests.test_release_build tests.test_metal_readback -v
      - name: Verify native helper failure and recovery paths
        run: >-
          python -X utf8 -B tools/verify_macos_native_failures.py --root product-output/native-failures
          --helper plugins/macos_capture/GameQACapture --fixture product-output/native/fixture
      - name: Recheck the previously passing independent Metal probe
        if: ${{ !cancelled() }}
        env:
          GAMEQA_PROBE_RENDERER: metal
          GAMEQA_CAPTURE_MODE: snapshot
        run: |
          git fetch --no-tags --depth=1 origin b29b1c5a8df5608a5cfd784a34e443ef56d69872
          git show b29b1c5a8df5608a5cfd784a34e443ef56d69872:tools/probe_macos_capture.swift > product-output/native/baseline.swift
          xcrun swiftc -parse-as-library -swift-version 5 -O product-output/native/baseline.swift -o product-output/native/baseline -framework AppKit -framework ScreenCaptureKit -framework CoreMedia -framework CoreVideo -framework CoreImage -framework Metal -framework MetalKit
          python -X utf8 -B - <<'PY'
          import json
          import os
          import signal
          import subprocess
          from pathlib import Path
          cases = [('baseline', 'baseline-metal', 'snapshot', False),
                   ('fixture', 'current-independent-metal', 'snapshot', False),
                   ('fixture', 'cadence-stream', 'stream', True),
                   ('fixture', 'cadence-snapshot', 'snapshot', True)]
          for executable, name, mode, product_cadence in cases:
              environment = dict(os.environ, GAMEQA_CAPTURE_MODE=mode)
              if product_cadence:
                  environment['GAMEQA_PROBE_PRODUCT_CADENCE'] = '1'
              root = Path('product-output', name).resolve()
              root.mkdir(parents=True, exist_ok=True)
              with (root / 'run.log').open('wb') as log:
                  process = subprocess.Popen([str(Path('product-output/native', executable).resolve()), 'capture', str(root)],
                                             stdout=log, stderr=subprocess.STDOUT, start_new_session=True, env=environment)
                  cleanup = {'timed_out': False}
                  try:
                      process.wait(timeout=100)
                  except subprocess.TimeoutExpired:
                      cleanup['timed_out'] = True
                  finally:
                      try:
                          os.killpg(process.pid, signal.SIGTERM)
                          cleanup['remaining_group_terminated'] = True
                      except ProcessLookupError:
                          cleanup['remaining_group_terminated'] = False
                      try:
                          process.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          os.killpg(process.pid, signal.SIGKILL)
                          process.wait(timeout=5)
                          cleanup['forced_kill'] = True
                      cleanup['parent_exit_code'] = process.returncode
                      (root / 'watchdog.json').write_text(json.dumps(cleanup, indent=2))
          PY
      - name: Verify source MCP observation against real windows
        if: ${{ !cancelled() }}
        run: python -X utf8 -B tools/verify_macos_product.py --root product-output/source --fixture product-output/native/fixture
      - name: Verify source MCP observation of a Metal window
        if: ${{ !cancelled() }}
        env:
          GAMEQA_PROBE_RENDERER: metal
        run: python -X utf8 -B tools/verify_macos_product.py --root product-output/source-metal --fixture product-output/native/fixture
      - name: Diagnose source Metal pixels before presentation
        if: ${{ !cancelled() }}
        env:
          GAMEQA_PROBE_RENDERER: metal
          GAMEQA_PROBE_GPU_READBACK: '1'
        run: python -X utf8 -B tools/verify_macos_product.py --root product-output/source-metal-readback --fixture product-output/native/fixture
      - name: Independently decode source GPU readback bytes
        if: ${{ !cancelled() }}
        run: python -X utf8 -B tools/verify_metal_readback.py product-output/source-metal-readback > product-output/source-metal-readback-verification.json
      - name: Build arm64 application with native capture component
        if: ${{ !cancelled() }}
        run: python -X utf8 -B tools/build_unix.py --version v0.4.3-macos-capture-test --output "$RUNNER_TEMP/macos-product-build"
      - name: Verify frozen MCP and observation worker against real windows
        if: ${{ !cancelled() }}
        run: >-
          python -X utf8 -B tools/verify_macos_product.py --root product-output/frozen
          --fixture product-output/native/fixture
          --executable "$RUNNER_TEMP/macos-product-build/dist/GameQA.app/Contents/MacOS/GameQA"
      - name: Verify packaged helper failure and recovery paths
        if: ${{ !cancelled() }}
        run: |
          python -X utf8 -B - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          app = Path(os.environ['RUNNER_TEMP'], 'macos-product-build/dist/GameQA.app')
          helpers = {path.resolve() for path in app.rglob('GameQACapture') if path.is_file()}
          assert len(helpers) == 1, helpers
          subprocess.run([sys.executable, '-X', 'utf8', '-B', 'tools/verify_macos_native_failures.py',
                          '--root', 'product-output/frozen-native-failures', '--helper', str(helpers.pop()),
                          '--fixture', 'product-output/native/fixture'], check=True)
          PY
      - name: Verify frozen MCP and observation of a Metal window
        if: ${{ !cancelled() }}
        env:
          GAMEQA_PROBE_RENDERER: metal
        run: >-
          python -X utf8 -B tools/verify_macos_product.py --root product-output/frozen-metal
          --fixture product-output/native/fixture
          --executable "$RUNNER_TEMP/macos-product-build/dist/GameQA.app/Contents/MacOS/GameQA"
      - name: Diagnose frozen Metal pixels before presentation
        if: ${{ !cancelled() }}
        env:
          GAMEQA_PROBE_RENDERER: metal
          GAMEQA_PROBE_GPU_READBACK: '1'
        run: >-
          python -X utf8 -B tools/verify_macos_product.py --root product-output/frozen-metal-readback
          --fixture product-output/native/fixture
          --executable "$RUNNER_TEMP/macos-product-build/dist/GameQA.app/Contents/MacOS/GameQA"
      - name: Independently decode frozen GPU readback bytes
        if: ${{ !cancelled() }}
        run: python -X utf8 -B tools/verify_metal_readback.py product-output/frozen-metal-readback > product-output/frozen-metal-readback-verification.json
      - name: Verify Cocoa UI
        if: ${{ !cancelled() }}
        run: >-
          QT_QPA_PLATFORM=cocoa "$RUNNER_TEMP/macos-product-build/dist/GameQA.app/Contents/MacOS/GameQA"
          --smoke-test product-output/desktop-check.json
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-arm-product-evidence
          path: product-output/
          retention-days: 14
      - name: Upload checked application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-arm-product-package
          path: |
            ${{ runner.temp }}/macos-product-build/game-qa-kit-*.tar.gz
            ${{ runner.temp }}/macos-product-build/SHA256SUMS.txt
            ${{ runner.temp }}/macos-product-build/self-test.*
          retention-days: 14

  frame-timing:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.frame_timing_only }}
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Compile independent fixture
        run: |
          mkdir -p frame-timing/native
          uname -a > frame-timing/environment.txt
          sw_vers >> frame-timing/environment.txt
          test "$(uname -m)" = arm64
          xcrun swiftc -parse-as-library -swift-version 5 -O tools/probe_macos_capture.swift -o frame-timing/native/fixture -framework AppKit -framework ScreenCaptureKit -framework CoreMedia -framework CoreVideo -framework CoreImage -framework Metal -framework MetalKit
      - name: Collect bounded image and sample-buffer controls
        run: |
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import signal
          import subprocess

          fixture = Path('frame-timing/native/fixture').resolve()
          for name, renderer, sample_buffer in [
              ('metal-image', 'metal', False),
              ('metal-image-resize-once', 'metal', False),
              ('metal-sample-buffer', 'metal', True),
              ('appkit-sample-buffer', 'appkit', True),
          ]:
              root = Path('frame-timing', name).resolve()
              root.mkdir(exist_ok=False)
              env = dict(os.environ, GAMEQA_CAPTURE_MODE='snapshot',
                         GAMEQA_PROBE_PRODUCT_CADENCE='1', GAMEQA_PROBE_RENDERER=renderer)
              if sample_buffer:
                  env['GAMEQA_PROBE_SAMPLE_BUFFER'] = '1'
              if name == 'metal-image-resize-once':
                  env['GAMEQA_PROBE_RESIZE_ONCE'] = '1'
              cleanup = {'timed_out': False}
              with (root / 'run.log').open('wb') as log:
                  process = subprocess.Popen([str(fixture), 'capture', str(root)],
                                             stdout=log, stderr=subprocess.STDOUT,
                                             start_new_session=True, env=env)
                  try:
                      process.wait(timeout=100)
                  except subprocess.TimeoutExpired:
                      cleanup['timed_out'] = True
                  finally:
                      try:
                          os.killpg(process.pid, signal.SIGTERM)
                          cleanup['remaining_group_terminated'] = True
                      except ProcessLookupError:
                          cleanup['remaining_group_terminated'] = False
                      try:
                          process.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          os.killpg(process.pid, signal.SIGKILL)
                          process.wait(timeout=5)
                          cleanup['forced_kill'] = True
                      cleanup['parent_exit_code'] = process.returncode
                      (root / 'watchdog.json').write_text(json.dumps(cleanup, indent=2))
              assert not cleanup['timed_out'], (name, cleanup)
              assert (root / 'result.json').is_file(), name
          PY
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: metal-frame-timing-evidence
          path: frame-timing/
          retention-days: 14
